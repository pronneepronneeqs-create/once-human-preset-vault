<script>
  // Clean start - No default demo presets
  const INITIAL_PRESETS = [];

  let presets = [...INITIAL_PRESETS];
  let activePresetId = null;
  let showFavoritesOnly = false;

  function renderPresets() {
    const grid = document.getElementById('presetGrid');
    const emptyState = document.getElementById('emptyState');
    const searchQuery = document.getElementById('searchInput').value.toLowerCase();
    const gender = document.getElementById('genderFilter').value;
    const sortBy = document.getElementById('sortBy').value;

    let filtered = presets.filter(p => {
      const matchesSearch = p.title.toLowerCase().includes(searchQuery) ||
                            p.author.toLowerCase().includes(searchQuery) ||
                            p.tags.some(t => t.toLowerCase().includes(searchQuery));
      const matchesGender = gender === 'all' || p.bodyType === gender;
      const matchesFav = !showFavoritesOnly || p.favorite;
      return matchesSearch && matchesGender && matchesFav;
    });

    if (sortBy === 'top') filtered.sort((a, b) => b.votes - a.votes);
    else if (sortBy === 'trending') filtered.sort((a, b) => (b.votes * 1.5) - (a.votes * 1.5));
    else filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

    grid.innerHTML = '';
    if (filtered.length === 0) emptyState.classList.remove('hidden');
    else {
      emptyState.classList.add('hidden');
      filtered.forEach(preset => grid.appendChild(createPresetCard(preset)));
    }
    lucide.createIcons();
  }

  function createPresetCard(p) {
    const card = document.createElement('div');
    card.className = "glass-panel rounded-xl overflow-hidden hover:border-slate-600 transition-all duration-300 flex flex-col group cursor-pointer";
    card.innerHTML = `
      <div class="relative aspect-[4/5] bg-slate-900 overflow-hidden" onclick="openDetailModal('${p.id}')">
        <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="${p.title}">
        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent opacity-80"></div>
        <div class="absolute top-3 left-3 flex gap-2">
          <span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-900/80 text-cyan-400 border border-cyan-500/30 uppercase tracking-wider backdrop-blur-md">${p.bodyType}</span>
        </div>
        <button onclick="event.stopPropagation(); toggleFavorite('${p.id}')" class="absolute top-3 right-3 p-2 rounded-full bg-slate-900/80 text-slate-400 hover:text-amber-400 border border-slate-700/80 transition backdrop-blur-md ${p.favorite ? 'text-amber-400 fill-amber-400' : ''}">
          <i data-lucide="bookmark" class="w-4 h-4"></i>
        </button>
        <div class="absolute bottom-3 left-3 right-3 flex items-end justify-between">
          <div>
            <h3 class="text-lg font-bold text-white group-hover:text-cyan-400 transition-colors leading-tight">${p.title}</h3>
            <p class="text-xs text-slate-400">By @${p.author}</p>
          </div>
        </div>
      </div>
      <div class="p-4 bg-slate-950/60 flex items-center justify-between border-t border-slate-800/80 mt-auto">
        <div class="flex gap-1 flex-wrap">
          ${p.tags.slice(0, 2).map(t => `<span class="text-[10px] px-2 py-0.5 rounded bg-slate-900 text-slate-400 border border-slate-800">#${t}</span>`).join('')}
        </div>
        <button onclick="event.stopPropagation(); toggleVote('${p.id}')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border text-xs font-semibold transition ${p.voted ? 'bg-cyan-500/20 text-cyan-400 border-cyan-500/50' : 'bg-slate-900 text-slate-300 border-slate-800 hover:border-slate-700'}">
          <i data-lucide="arrow-big-up" class="w-4 h-4"></i>
          <span>${p.votes}</span>
        </button>
      </div>
    `;
    return card;
  }

  function openDetailModal(id) {
    activePresetId = id;
    const p = presets.find(item => item.id === id);
    if (!p) return;
    document.getElementById('modalTitle').innerText = p.title;
    document.getElementById('modalAuthor').innerText = `By @${p.author}`;
    document.getElementById('modalBodyType').innerText = p.bodyType;
    document.getElementById('modalDescription').innerText = p.description || "No description provided.";
    document.getElementById('modalImage').src = p.image;
    document.getElementById('modalQR').src = p.qr;
    document.getElementById('modalCode').innerText = p.code || "OH-PRESET";
    document.getElementById('modalVoteCount').innerText = p.votes;
    document.getElementById('modalTags').innerHTML = p.tags.map(t => `<span class="text-xs px-2.5 py-1 rounded bg-slate-800 text-cyan-400 border border-slate-700">#${t}</span>`).join('');
    updateModalButtonStates(p);
    renderComments(p);
    document.getElementById('detailModal').classList.remove('hidden');
    lucide.createIcons();
  }

  function closeDetailModal() { document.getElementById('detailModal').classList.add('hidden'); }
  function updateModalButtonStates(p) {
    document.getElementById('modalVoteBtn').className = p.voted ? "flex-1 flex items-center justify-center gap-2 bg-cyan-500/20 text-cyan-400 border border-cyan-500/50 py-2.5 rounded-lg font-medium transition" : "flex-1 flex items-center justify-center gap-2 bg-slate-800 hover:bg-cyan-500/20 hover:text-cyan-400 hover:border-cyan-500/50 border border-slate-700 text-slate-300 py-2.5 rounded-lg font-medium transition";
    document.getElementById('modalFavBtn').className = p.favorite ? "px-4 py-2.5 bg-amber-500/20 text-amber-400 border border-amber-500/50 rounded-lg transition" : "px-4 py-2.5 bg-slate-800 hover:bg-amber-500/20 hover:text-amber-400 border border-slate-700 text-slate-300 rounded-lg transition";
  }

  function renderComments(p) {
    document.getElementById('commentsList').innerHTML = p.comments.map(c => `
      <div class="bg-slate-900/80 p-2.5 rounded-lg border border-slate-800 text-xs">
        <span class="font-semibold text-slate-300 block mb-0.5">@${c.author}</span>
        <p class="text-slate-400">${c.text}</p>
      </div>
    `).join('');
  }

  function addComment() {
    const input = document.getElementById('commentInput');
    const text = input.value.trim();
    if (!text || !activePresetId) return;
    const p = presets.find(item => item.id === activePresetId);
    p.comments.push({ author: "You", text });
    input.value = '';
    renderComments(p);
  }

  function toggleVote(id) {
    const p = presets.find(item => item.id === id);
    if (!p) return;
    p.voted ? (p.votes--, p.voted = false) : (p.votes++, p.voted = true);
    renderPresets();
  }

  function toggleModalVote() {
    if (!activePresetId) return;
    toggleVote(activePresetId);
    const p = presets.find(item => item.id === activePresetId);
    document.getElementById('modalVoteCount').innerText = p.votes;
    updateModalButtonStates(p);
  }

  function toggleFavorite(id) {
    const p = presets.find(item => item.id === id);
    if (!p) return;
    p.favorite = !p.favorite;
    renderPresets();
  }

  function toggleModalFavorite() {
    if (!activePresetId) return;
    toggleFavorite(activePresetId);
    updateModalButtonStates(presets.find(item => item.id === activePresetId));
  }

  function toggleFavoritesOnly() {
    showFavoritesOnly = !showFavoritesOnly;
    document.getElementById('favToggleBtn').classList.toggle('bg-amber-500/20');
    document.getElementById('favToggleBtn').classList.toggle('text-amber-400');
    renderPresets();
  }

  function resetFilters() {
    document.getElementById('searchInput').value = '';
    document.getElementById('genderFilter').value = 'all';
    document.getElementById('sortBy').value = 'newest';
    showFavoritesOnly = false;
    renderPresets();
  }

  function copyModalCode() {
    navigator.clipboard.writeText(document.getElementById('modalCode').innerText);
    alert('Preset Code Copied to Clipboard!');
  }

  function openPublishModal() { document.getElementById('publishModal').classList.remove('hidden'); }
  function closePublishModal() { document.getElementById('publishModal').classList.add('hidden'); }

  function handlePublish(e) {
    e.preventDefault();
    const newPreset = {
      id: Date.now().toString(),
      title: document.getElementById('pubTitle').value,
      author: document.getElementById('pubAuthor').value,
      bodyType: document.getElementById('pubBodyType').value,
      tags: document.getElementById('pubTags').value.split(',').map(t => t.trim()).filter(Boolean),
      image: document.getElementById('pubImageUrl').value,
      qr: document.getElementById('pubQRUrl').value,
      code: `OH-${Math.random().toString(36).substring(2, 7).toUpperCase()}`,
      votes: 1,
      voted: true,
      favorite: false,
      date: new Date().toISOString().split('T')[0],
      description: document.getElementById('pubDesc').value,
      comments: []
    };

    presets.unshift(newPreset);
    closePublishModal();
    document.getElementById('publishForm').reset();
    renderPresets();
  }

  document.addEventListener('DOMContentLoaded', renderPresets);
</script>
